name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Electron App
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: Desktop App Build ${{ github.run_number }}
          body: |
            ## CrowdShield Desktop Command Center
            
            ### Downloads by Platform
            
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `*.exe` installer or portable | Windows 10+ required |
            | macOS | `*.dmg` | macOS 12+ required |
            | Linux | `*.AppImage` or `*.deb` | Ubuntu 20.04+ |
            
            ### Features
            - Full command center dashboard
            - Real-time venue digital twin
            - CCTV camera grid with live feeds
            - Device camera integration
            - AI-powered chat assistant
            - Native permission management
            - System notifications for critical alerts
            - Multi-monitor support
            
            ### Permissions
            The app will request permissions on first launch:
            - Camera: for crowd detection
            - Microphone: for ambient noise monitoring
            - Notifications: for critical alerts
            - Location: for emergency navigation
            - Screen Capture: for CCTV monitoring
          files: |
            builds/desktop-*/**/*.exe
            builds/desktop-*/**/*.AppImage
            builds/desktop-*/**/*.deb
            builds/desktop-*/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
