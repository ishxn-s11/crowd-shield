name: Build Mobile App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crowdshield-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success() || steps.build-release.outcome == 'success'
        with:
          name: crowdshield-release
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

  verify-install:
    name: Verify APK Installs on Emulator
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: crowdshield-debug
          path: apk/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android Emulator and Install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "=== Waiting for emulator to boot ==="
            adb wait-for-device
            adb shell getprop sys.boot_completed
            echo "=== Emulator booted ==="

            echo "=== Installing APK ==="
            APK_PATH=$(find apk/ -name "*.apk" | head -1)
            echo "APK: $APK_PATH"
            adb install -t "$APK_PATH"
            INSTALL_EXIT=$?

            if [ $INSTALL_EXIT -ne 0 ]; then
              echo "ERROR: APK installation failed with exit code $INSTALL_EXIT"
              exit 1
            fi

            echo "=== APK installed successfully ==="

            echo "=== Verifying package is installed ==="
            adb shell pm list packages | grep com.crowdshield.mobile
            VERIFY_EXIT=$?

            if [ $VERIFY_EXIT -ne 0 ]; then
              echo "ERROR: Package com.crowdshield.mobile not found after install"
              exit 1
            fi

            echo "=== Package verified ==="

            echo "=== Launching app to verify no crash ==="
            adb shell am start -n com.crowdshield.mobile/.MainActivity
            sleep 5

            echo "=== Checking app is still running ==="
            CRASHED=$(adb shell "dumpsys activity activities | grep com.crowdshield.mobile | head -1")
            if echo "$CRASHED" | grep -q "com.crowdshield.mobile"; then
              echo "=== App is running successfully ==="
            else
              echo "WARNING: App may have crashed. Checking logcat..."
              adb logcat -d -t 50 | grep -i "crowdshield\|fatal\|crash" || true
            fi

            echo "=== Checking for crash in logcat ==="
            CRASH_LOG=$(adb logcat -d | grep -iE "FATAL|AndroidRuntime.*crowdshield|Process.*com.crowdshield.*died" | tail -5)
            if [ -n "$CRASH_LOG" ]; then
              echo "ERROR: Crash detected in logcat:"
              echo "$CRASH_LOG"
              exit 1
            fi

            echo "=== All checks passed ==="
            echo "Summary:"
            echo "  APK install: ✅"
            echo "  Package present: ✅"
            echo "  App launches: ✅"
            echo "  No crashes: ✅"

  typecheck-expo:
    name: Typecheck Expo App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  release:
    needs: [build-android, verify-install, typecheck-expo]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: Mobile App Build ${{ github.run_number }}
          body: |
            ## CrowdShield Mobile App

            ### Downloads
            - **Android APK**: Download `app-debug.apk` for testing
            - **Android APK (Release)**: Download `app-release-unsigned.apk` for production

            ### Installation
            1. Download the APK file
            2. On Android, enable "Install from Unknown Sources" if prompted
            3. Install and open CrowdShield

            ### Build Info
            - Built with Gradle on JDK 17
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 35 (Android 15)

            ### Verification
            - ✅ APK installs successfully on Android 11 (API 30) emulator
            - ✅ App launches without crashes
            - ✅ No fatal errors in logcat
          files: |
            builds/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
